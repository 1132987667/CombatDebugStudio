<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>水墨西游 - 降妖之路</title>
    <style>
      /* 全局样式与水墨风格设计 */
      :root {
        --jiao-mo: #1a1a1a;
        --nong-mo: #333333;
        --dan-mo: #666666;
        --qing-mo: #999999;
        --xuan-zhi: #f8f5f0;
        --mi-se: #faf0e6;
        --xiang-ya-bai: #fffff0;
        --zhu-hong: #c41e3a;
        --qing-lv: #2e8b57;
        --jin-se: #d4af37;
        --shan-shui-1: #8ba88e;
        --shan-shui-2: #c4d7d1;
        --shan-shui-3: #f0e6d2;
        --lan-se: #4a90e2;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'SimSun', 'Microsoft YaHei', sans-serif;
        background: var(--xuan-zhi);
        color: var(--jiao-mo);
        overflow: hidden;
        height: 100vh;
        background-image:
          radial-gradient(
            ellipse at 20% 20%,
            rgba(139, 168, 142, 0.1) 0%,
            transparent 40%
          ),
          radial-gradient(
            ellipse at 80% 80%,
            rgba(196, 215, 209, 0.1) 0%,
            transparent 40%
          );
        position: relative;
        font-size: 14px;
        line-height: 1.3;
      }

      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M0,0 L100,0 L100,100 L0,100 Z" fill="none" stroke="%23F0E6D2" stroke-width="0.5" stroke-dasharray="2,2"/></svg>');
        opacity: 0.3;
        pointer-events: none;
        z-index: 1;
      }

      .game-container {
        display: flex;
        height: 100vh;
        padding: 10px;
        gap: 10px;
        position: relative;
        z-index: 2;
      }

      /* 左侧区域 - 场景画卷 */
      .scenes-panel {
        width: 320px;
        background: var(--mi-se);
        border-radius: 6px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(51, 51, 51, 0.1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .scenes-title {
        font-size: 1.6rem;
        text-align: center;
        padding: 12px 0 8px;
        color: var(--nong-mo);
        letter-spacing: 6px;
        background: var(--xiang-ya-bai);
        border-bottom: 2px solid var(--dan-mo);
        font-weight: bold;
        position: relative;
      }

      .scenes-title::after,
      .scenes-title::before {
        content: '◆';
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        color: var(--zhu-hong);
        font-size: 1rem;
      }

      .scenes-title::before {
        left: 15px;
      }
      .scenes-title::after {
        right: 15px;
      }

      .scenes-list {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .scene-card {
        background: var(--xuan-zhi);
        border-radius: 4px;
        padding: 10px;
        border: 1px solid var(--dan-mo);
        transition: all 0.2s ease;
        cursor: pointer;
        position: relative;
      }

      .scene-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.08);
        border-color: var(--zhu-hong);
      }

      .scene-card.active {
        border-color: var(--zhu-hong);
        background: rgba(196, 30, 58, 0.05);
      }

      .scene-card.active::after {
        content: '✔';
        position: absolute;
        top: 8px;
        right: 8px;
        color: var(--zhu-hong);
        font-size: 1rem;
        font-weight: bold;
      }

      .scene-card.locked {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .scene-card.locked:hover {
        transform: none;
        box-shadow: none;
        border-color: var(--dan-mo);
      }

      .scene-name {
        font-size: 1.4rem;
        margin-bottom: 5px;
        color: var(--nong-mo);
        font-weight: bold;
        position: relative;
        display: inline-block;
      }

      .scene-name::after {
        content: '';
        position: absolute;
        bottom: -3px;
        left: 0;
        width: 40%;
        height: 1px;
        background: var(--qing-lv);
      }

      .scene-level {
        font-size: 0.8rem;
        color: var(--dan-mo);
        margin-bottom: 6px;
      }

      .scene-enemies {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }

      .enemy-tag {
        background: rgba(46, 139, 87, 0.1);
        color: var(--qing-lv);
        padding: 2px 6px;
        border-radius: 10px;
        font-size: 0.75rem;
        border: 1px solid rgba(46, 139, 87, 0.3);
      }

      .scene-drops {
        font-size: 0.75rem;
        color: var(--dan-mo);
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .drop-item {
        background: rgba(212, 175, 55, 0.1);
        color: var(--jin-se);
        padding: 1px 5px;
        border-radius: 8px;
        border: 1px solid rgba(212, 175, 55, 0.3);
      }

      .scene-difficulty-selector {
        display: flex;
        gap: 6px;
        margin-bottom: 6px;
      }

      .diff-badge {
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.7rem;
        background: rgba(51, 51, 51, 0.05);
        border: 1px solid rgba(51, 51, 51, 0.2);
        color: var(--dan-mo);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .diff-badge.active {
        background: rgba(196, 30, 58, 0.1);
        border-color: var(--zhu-hong);
        color: var(--zhu-hong);
      }

      .diff-badge:hover:not(.active) {
        background: rgba(139, 168, 142, 0.1);
        border-color: var(--qing-lv);
      }

      .enemy-tag.boss {
        background: rgba(196, 30, 58, 0.15);
        border-color: rgba(196, 30, 58, 0.4);
        color: var(--zhu-hong);
      }

      /* 中间区域 - 战斗禅台 */
      .battle-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--mi-se);
        border-radius: 6px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(51, 51, 51, 0.1);
        overflow: hidden;
      }

      .scene-info {
        padding: 12px;
        text-align: center;
        border-bottom: 1px solid rgba(51, 51, 51, 0.1);
        background: var(--xiang-ya-bai);
      }

      .current-scene {
        font-size: 2rem;
        color: var(--nong-mo);
        margin-bottom: 4px;
        letter-spacing: 3px;
        font-weight: bold;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0;
      }

      .scene-difficulty {
        font-size: 0.9rem;
        color: var(--zhu-hong);
        display: inline-block;
        padding: 2px 10px;
        border-radius: 12px;
        background: rgba(196, 30, 58, 0.1);
        border: 1px solid rgba(196, 30, 58, 0.3);
        margin-left: 8px;
      }

      .enemy-bubbles {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 10px;
        flex-wrap: wrap;
      }

      .enemy-drops-info {
        margin-top: 8px;
        padding: 8px;
        background: rgba(212, 175, 55, 0.08);
        border-radius: 4px;
        border: 1px dashed rgba(212, 175, 55, 0.3);
      }

      .enemy-drops-title {
        font-size: 0.8rem;
        color: var(--jin-se);
        font-weight: bold;
        display: inline-block;
        margin: 2px 6px 2px 0;
        padding: 1px 6px;
      }

      .enemy-drop-item {
        font-size: 0.75rem;
        color: var(--dan-mo);
        display: inline-block;
        margin: 2px 6px 2px 0;
        padding: 1px 6px;
        background: rgba(212, 175, 55, 0.1);
        border-radius: 8px;
      }

      .enemy-bubble {
        position: relative;
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      .enemy-bubble:hover {
        transform: translateY(-3px);
      }

      .enemy-bubble::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(139, 168, 142, 0.1);
        filter: blur(4px);
        z-index: 0;
      }

      .enemy-name {
        position: relative;
        z-index: 1;
        font-size: 1rem;
        color: var(--nong-mo);
        padding: 6px 12px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(51, 51, 51, 0.2);
      }

      .enemy-level {
        color: var(--zhu-hong);
        font-weight: bold;
      }

      /* 气血与能量 */
      .health-energy-container {
        display: flex;
        padding: 12px;
        gap: 20px;
        justify-content: center;
      }

      .character-stats,
      .enemy-stats {
        width: 260px;
        padding: 12px;
        background: var(--xuan-zhi);
        border-radius: 6px;
        border: 1px solid rgba(51, 51, 51, 0.1);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      }

      .stats-title {
        font-size: 1.2rem;
        margin-bottom: 10px;
        text-align: center;
        color: var(--nong-mo);
        position: relative;
        padding-bottom: 6px;
        font-weight: bold;
      }

      .stats-title::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 50px;
        height: 1px;
        background: var(--qing-lv);
      }

      .health-bar-container,
      .energy-bar-container {
        margin-bottom: 10px;
      }

      .bar-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
        font-size: 0.85rem;
        color: var(--dan-mo);
      }

      .health-bar,
      .energy-bar {
        height: 16px;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(51, 51, 51, 0.2);
      }

      .health-fill {
        height: 100%;
        background: linear-gradient(90deg, #c41e3a, #ff6b6b);
        transition: width 0.4s ease;
        position: relative;
      }

      .health-fill::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        animation: shimmer 2s infinite;
      }

      .energy-fill {
        height: 100%;
        background: linear-gradient(90deg, #d4af37, #ffd700);
        transition: width 0.4s ease;
        position: relative;
      }

      .energy-fill::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.4),
          transparent
        );
        animation: shimmer 2s infinite;
      }

      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      /* 技能灵台 */
      .skills-platform {
        padding: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .skills-title {
        font-size: 1.4rem;
        margin-bottom: 12px;
        color: var(--nong-mo);
        position: relative;
        display: inline-block;
        font-weight: bold;
      }

      .skills-title::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 100%;
        height: 1px;
        background: var(--qing-lv);
      }

      .skills-container {
        display: flex;
        gap: 15px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }

      .skill-btn {
        width: 120px;
        height: 48px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        border: none;
        color: var(--xuan-zhi);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        padding: 6px;
        text-align: center;
        line-height: 1.2;
      }

      .skill-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.2) 0%,
          transparent 50%
        );
        z-index: 1;
      }

      .skill-btn span {
        position: relative;
        z-index: 2;
      }

      .skill-btn.basic {
        background: linear-gradient(135deg, var(--qing-mo), var(--dan-mo));
      }
      .skill-btn.minor {
        background: linear-gradient(135deg, #4a90e2, #2e8b57);
      }
      .skill-btn.major {
        background: linear-gradient(135deg, var(--zhu-hong), #d4af37);
      }

      .skill-btn:hover:not(:disabled) {
        transform: scale(1.03);
        box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15);
      }

      .skill-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .auto-battle-toggle {
        width: 70px;
        height: 45px;
        border-radius: 6px;
        background: linear-gradient(135deg, var(--dan-mo), var(--nong-mo));
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--xuan-zhi);
        cursor: pointer;
        transition: all 0.2s ease;
        border: none;
        font-size: 0.75rem;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }

      .auto-battle-toggle.active {
        background: linear-gradient(135deg, var(--jin-se), #d4af37);
        box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
      }

      .auto-battle-toggle:hover {
        transform: translateY(-2px);
      }

      /* 战斗心经 */
      .battle-log {
        flex: 1;
        margin: 12px 0;
        min-height: 0;
        background: var(--xuan-zhi);
        border-radius: 6px;
        padding: 10px;
        border: 1px solid rgba(51, 51, 51, 0.1);
        overflow-y: auto;
        box-shadow: inset 0 1px 6px rgba(0, 0, 0, 0.05);
      }

      .log-title {
        font-size: 1.2rem;
        margin-bottom: 8px;
        color: var(--nong-mo);
        text-align: center;
        position: relative;
        padding-bottom: 6px;
        font-weight: bold;
      }

      .log-title::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 1px;
        background: var(--qing-lv);
      }

      .log-entry {
        padding: 6px;
        margin-bottom: 6px;
        border-radius: 3px;
        font-size: 0.8rem;
        line-height: 1.2;
        animation: fadeIn 0.4s ease;
        border-left: 2px solid transparent;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .log-entry.player {
        background: rgba(46, 139, 87, 0.05);
        border-left-color: var(--qing-lv);
      }
      .log-entry.enemy {
        background: rgba(196, 30, 58, 0.05);
        border-left-color: var(--zhu-hong);
      }
      .log-entry.system {
        background: rgba(51, 51, 51, 0.05);
        border-left-color: var(--dan-mo);
      }
      .log-entry.critical {
        color: var(--zhu-hong);
        font-weight: bold;
      }
      .log-entry.heal {
        color: var(--qing-lv);
      }

      /* 右侧区域 - 功能宝阁 */
      .functions-panel {
        width: 420px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .functions-tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        background: var(--mi-se);
        border-radius: 6px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(51, 51, 51, 0.1);
        overflow: hidden;
        padding: 8px;
        gap: 8px;
      }

      .tab-button {
        padding: 10px 8px;
        background: var(--xiang-ya-bai);
        border: 1px solid rgba(51, 51, 51, 0.15);
        font-size: 0.9rem;
        color: var(--dan-mo);
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        font-weight: bold;
        border-radius: 4px;
      }

      .tab-button:hover {
        background: rgba(139, 168, 142, 0.1);
        color: var(--nong-mo);
      }

      .tab-button.active {
        background: rgba(196, 30, 58, 0.1);
        color: var(--zhu-hong);
      }

      .tab-content {
        flex: 1;
        padding: 12px;
        overflow-y: hidden;
        background: var(--xuan-zhi);
        border-radius: 6px;
        border: 1px solid rgba(51, 51, 51, 0.1);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      }

      #skills-tab {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }

      #settings-tab {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow-y: auto;
        padding: 12px;
      }

      .settings-content {
        flex: 1;
      }

      .setting-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid rgba(51, 51, 51, 0.1);
      }

      .setting-item:last-child {
        border-bottom: none;
      }

      .setting-item label {
        font-size: 0.9rem;
        color: var(--nong-mo);
      }

      .setting-item input[type='checkbox'] {
        transform: scale(1.2);
      }

      .setting-item select {
        padding: 4px 8px;
        border: 1px solid rgba(51, 51, 51, 0.2);
        border-radius: 4px;
        background: var(--xiang-ya-bai);
        color: var(--nong-mo);
      }

      .skill-points-display {
        background: var(--xuan-zhi);
        border-radius: 6px;
        padding: 10px 12px;
        margin-bottom: 10px;
        border: 1px solid rgba(51, 51, 51, 0.1);
        font-size: 0.85rem;
        color: var(--nong-mo);
      }

      .point-item {
        margin: 0 12px 0 0;
        padding: 3px 8px;
        background: rgba(212, 175, 55, 0.1);
        border-radius: 4px;
        border: 1px solid rgba(212, 175, 55, 0.3);
      }

      .point-item:last-child {
        margin-right: 0;
      }

      .point-item span {
        color: var(--jin-se);
        font-weight: bold;
      }

      .skills-content {
        flex: 1;
        overflow-y: auto;
        padding-right: 12px;
      }

      .skill-info-panel {
        background: var(--mi-se);
        border-radius: 6px;
        padding: 12px;
        border: 1px solid rgba(51, 51, 51, 0.15);
        margin: 10px 0;
        min-height: 80px;
      }

      .skill-info-title {
        font-size: 1rem;
        font-weight: bold;
        color: var(--nong-mo);
        margin-bottom: 6px;
      }

      .skill-info-desc {
        font-size: 0.85rem;
        color: var(--dan-mo);
        line-height: 1.5;
      }

      .skill-info-stats {
        display: flex;
        gap: 15px;
        margin-top: 8px;
        font-size: 0.8rem;
      }

      .skill-info-stat {
        color: var(--qing-lv);
      }

      .skill-buttons {
        display: flex;
        gap: 10px;
        padding: 10px 0 5px;
        border-top: 1px solid rgba(51, 51, 51, 0.1);
      }

      .skill-btn {
        flex: 1;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: inherit;
      }

      .skill-btn-reset {
        background: var(--dan-mo);
        color: var(--xiang-ya-bai);
      }

      .skill-btn-reset:hover {
        background: var(--nong-mo);
      }

      .skill-btn-confirm {
        background: var(--qing-lv);
        color: var(--xiang-ya-bai);
      }

      .skill-btn-confirm:hover {
        background: var(--shan-shui-1);
      }

      .tab-pane {
        display: none;
      }

      .tab-pane.active {
        display: block;
        height: 100%;
      }

      /* 卡片通用样式 */
      .content-card {
        background: var(--mi-se);
        border-radius: 6px;
        padding: 12px;
        border: 1px solid rgba(51, 51, 51, 0.1);
        margin-bottom: 10px;
        transition: all 0.2s ease;
      }

      .content-card:hover {
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        border-color: var(--qing-lv);
      }

      .content-card-title {
        font-size: 1.1rem;
        color: var(--nong-mo);
        margin-bottom: 8px;
        font-weight: bold;
        position: relative;
        padding-bottom: 6px;
      }

      .content-card-title::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 40px;

      /* 背包样式 */

        z-index: 100;

      /* 角色信息样式 */
      .character-info {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .character-level {

        color: var(--nong-mo);
        position: relative;
        padding-bottom: 8px;
        font-weight: bold;

      .character-level::after {
        content: '等级';

        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.9rem;
        color: var(--dan-mo);
      }

      .character-stats-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .stat-item {
        display: flex;
        justify-content: space-between;
        padding: 6px 8px;
        background: var(--mi-se);
        border-radius: 3px;
        border: 1px solid rgba(51, 51, 51, 0.1);
      }

      .stat-name {
        color: var(--dan-mo);
        font-size: 0.85rem;
      }
      .stat-value {
        color: var(--nong-mo);
        font-weight: bold;
        font-size: 0.85rem;
      }

      /* 技艺界面样式 */
      .crafting-categories {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .crafting-category {
        background: var(--mi-se);
        border-radius: 4px;
        padding: 10px;
        border: 1px solid rgba(51, 51, 51, 0.1);
      }

      .category-title {
        font-size: 1.1rem;
        margin-bottom: 8px;
        color: var(--nong-mo);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: bold;
      }

      .crafting-level {
        color: var(--zhu-hong);
        font-size: 1rem;
      }

      .crafting-progress {
        height: 8px;
        background: var(--xuan-zhi);
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 8px;
        border: 1px solid rgba(51, 51, 51, 0.2);
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--qing-lv), #4caf50);
        transition: width 0.4s ease;
      }

      .crafting-items {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .craft-item {
        background: var(--xuan-zhi);
        border-radius: 3px;
        padding: 8px;
        border: 1px solid rgba(51, 51, 51, 0.1);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .craft-item:hover {
        border-color: var(--qing-lv);
        background: rgba(46, 139, 87, 0.05);
      }

      .craft-item-name {
        font-size: 0.85rem;
        margin-bottom: 4px;
        color: var(--nong-mo);
      }

      .craft-item-materials {
        font-size: 0.75rem;
        color: var(--dan-mo);
      }

      /* 洞府界面样式 */
      .monastery-actions {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .action-btn {
        background: var(--mi-se);
        border-radius: 6px;
        padding: 15px 10px;
        border: 1px solid rgba(51, 51, 51, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: center;
      }

      .action-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        border-color: var(--qing-lv);
        background: rgba(46, 139, 87, 0.05);
      }

      .action-name {
        font-size: 1rem;
        color: var(--nong-mo);
        font-weight: bold;
      }

      .skill-path {
        margin-bottom: 20px;
        padding: 12px;
        background: var(--xuan-zhi);
        border-radius: 6px;
        border: 1px solid rgba(51, 51, 51, 0.1);
      }

      .path-name {
        font-size: 1.3rem;
        color: var(--nong-mo);
        margin-bottom: 12px;
        text-align: center;
        font-weight: bold;
        position: relative;
        padding-bottom: 6px;
      }

      .path-name::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 2px;
        background: var(--qing-lv);
      }

      .skill-section {
        margin-bottom: 12px;
      }

      .skill-section-title {
        font-size: 0.8rem;
        color: var(--dan-mo);
        margin-bottom: 6px;
        padding-left: 4px;
        border-left: 3px solid var(--qing-mo);
      }

      .skill-row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .skill-card {
        width: 100%;
        min-height: 55px;
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        cursor: pointer;
        transition: all 0.2s ease;
        border: 2px solid;
        background: var(--mi-se);
        padding: 8px 10px;
        text-align: left;
      }

      .skill-card.unselected {
        border-color: var(--qing-mo);
        background: rgba(51, 51, 51, 0.05);
      }

      .skill-card.unselected .skill-card-name {
        color: var(--dan-mo);
      }

      .skill-card.unselected .skill-card-type {
        color: var(--qing-mo);
      }

      .skill-card.learned {
        border-color: var(--jin-se);
        background: rgba(212, 175, 55, 0.15);
      }

      .skill-card.learned .skill-card-name {
        color: var(--nong-mo);
      }

      .skill-card.viewing {
        border-color: var(--lan-se);
        background: rgba(74, 144, 226, 0.15);
      }

      .skill-card.viewing .skill-card-name {
        color: var(--lan-se);
      }

      .skill-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .skill-card-name {
        font-size: 0.85rem;
        font-weight: bold;
        color: var(--nong-mo);
        line-height: 1.3;
      }

      .skill-card-type {
        font-size: 0.7rem;
        color: var(--dan-mo);
        margin-top: 3px;
      }

      .skill-selection-buttons {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 15px;
      }

      .selection-btn {
        padding: 8px 20px;
        background: var(--zhu-hong);
        color: var(--xuan-zhi);
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 0.9rem;
      }

      .selection-btn:hover {
        background: #a3172e;
        transform: translateY(-2px);
      }

      /* 打造装备界面样式 */
      .forge-category {
        margin-bottom: 15px;
      }

      .forge-items {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .forge-item {
        background: var(--mi-se);
        border-radius: 4px;
        padding: 10px;
        border: 1px solid rgba(51, 51, 51, 0.1);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .forge-item:hover {
        border-color: var(--qing-lv);
        background: rgba(46, 139, 87, 0.05);
      }

      .forge-item-name {
        font-size: 0.9rem;
        font-weight: bold;
        color: var(--nong-mo);
        margin-bottom: 5px;
      }

      .forge-item-stats {
        font-size: 0.75rem;
        color: var(--dan-mo);
        margin-bottom: 5px;
      }

      .forge-item-materials {
        font-size: 0.75rem;
        color: var(--zhu-hong);
      }

      /* 弹窗样式 */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .modal-overlay.active {
        opacity: 1;
        pointer-events: all;
      }

      .modal {
        background: var(--xuan-zhi);
        border-radius: 8px;
        padding: 20px;
        max-width: 450px;
        width: 90%;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        border: 2px solid var(--zhu-hong);
        position: relative;
        transform: translateY(15px);
        transition: transform 0.2s ease;
      }

      .modal-overlay.active .modal {
        transform: translateY(0);
      }

      .modal-title {
        font-size: 1.8rem;
        text-align: center;
        margin-bottom: 15px;
        color: var(--nong-mo);
        position: relative;
        padding-bottom: 10px;
        font-weight: bold;
      }

      .modal-title::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 2px;
        background: var(--zhu-hong);
      }

      .modal-content {
        margin-bottom: 20px;
      }

      .modal-result {
        font-size: 1rem;
        line-height: 1.5;
        margin-bottom: 10px;
      }

      .rewards-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .reward-item {
        background: rgba(212, 175, 55, 0.1);
        color: var(--jin-se);
        padding: 6px 10px;
        border-radius: 4px;
        border: 1px solid rgba(212, 175, 55, 0.3);
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 0.9rem;
      }

      .modal-buttons {
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      .modal-btn {
        padding: 8px 20px;
        background: var(--zhu-hong);
        color: var(--xuan-zhi);
        border: none;
        border-radius: 4px;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .modal-btn:hover {
        background: #a3172e;
        transform: translateY(-2px);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
      }

      /* BUFF列表布局 */
      .buff-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 8px;
        min-height: 40px;
      }

      .buff-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 8px;
        background: rgba(46, 139, 87, 0.1);
        border-radius: 4px;
        border-left: 3px solid var(--qing-lv);
      }

      .buff-item.debuff {
        background: rgba(196, 30, 58, 0.1);
        border-left-color: var(--zhu-hong);
      }

      .buff-name {
        font-size: 0.8rem;
        color: var(--nong-mo);
      }

      .buff-duration {
        font-size: 0.7rem;
        color: var(--dan-mo);
      }

      .buff-empty {
        font-size: 0.8rem;
        color: var(--qing-mo);
        text-align: center;
        padding: 8px;
        font-style: italic;
      }

      /* 装备槽位样式 */
      .equipment-slots {
        margin-top: 15px;
      }

      .equipment-slot {
        background: var(--mi-se);
        border-radius: 4px;
        padding: 10px;
        border: 1px solid rgba(51, 51, 51, 0.1);
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .equipment-slot:hover {
        border-color: var(--qing-lv);
        background: rgba(46, 139, 87, 0.05);
      }

      /* 响应式设计 */
      @media (max-width: 1200px) {
        .game-container {
          flex-direction: column;
          height: auto;
          overflow-y: auto;
        }

        .scenes-panel,
        .battle-panel,
        .functions-panel {
          width: 100%;
        }

        .scenes-panel {
          max-height: 250px;
        }
        .health-energy-container {
          flex-direction: column;
          align-items: center;
        }
        .character-stats,
        .enemy-stats {
          width: 100%;
          max-width: 350px;
        }
        .skills-container {
          gap: 10px;
        }
        .skill-btn {
          width: 60px;
          height: 60px;
          font-size: 0.7rem;
        }
        .auto-battle-toggle {
          width: 45px;
          height: 45px;
        }
      }

      /* 墨晕效果 */
      .ink-blot {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(26, 26, 26, 0.1) 0%,
          transparent 70%
        );
        filter: blur(8px);
        z-index: 0;
        pointer-events: none;
      }

      /* 滚动条样式 */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(51, 51, 51, 0.05);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(51, 51, 51, 0.2);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(51, 51, 51, 0.3);
      }
    </style>
  </head>
  <body>
    <!-- 墨晕效果元素 -->
    <div id="ink-effects"></div>

      <div class="scenes-panel">
        <div class="scenes-title">降妖路引</div>
        <div class="scenes-list" id="scenes-list">
          <!-- 场景将通过JavaScript动态生成 -->
        </div>
      </div>

      <!-- 中间区域：战斗禅台 -->
      <div class="battle-panel">
        <!-- 场景与敌情 -->
        <div class="scene-info">
          <div class="current-scene" id="current-scene">
            花果山外围<span
              class="scene-difficulty"
              id="scene-difficulty"
            ></span>
          </div>
          <div class="enemy-bubbles" id="enemy-bubbles">
            <!-- 敌人将通过JavaScript动态生成 -->
          </div>
          <div class="enemy-drops-info" id="enemy-drops-info">
            <!-- 当前敌人掉落信息将通过JavaScript动态生成 -->
          </div>
        </div>

        <div class="health-energy-container">
          <div class="character-stats">
            <div class="stats-title">玩家</div>
            <div class="health-bar-container">
              <div class="bar-label">
                <span>气血</span>
                <span id="player-health">100/100</span>
              </div>
              <div class="health-bar">
                <div
                  class="health-fill"
                  id="player-health-fill"
                  style="width: 100%"
                ></div>
              </div>
            </div>
            <div class="energy-bar-container">
              <div class="bar-label">
                <span>能量</span>
                <span id="player-energy">0/150</span>
              </div>
              <div class="energy-bar">
                <div
                  class="energy-fill"
                  id="player-energy-fill"
                  style="width: 0%"
                ></div>
              </div>
            </div>
            <div class="buff-list" id="player-buff-list">
              <!-- 玩家BUFF列表将通过JavaScript动态生成 -->
            </div>
          </div>

          <div class="enemy-stats">
            <div class="stats-title" id="enemy-name">花妖[1]</div>

              <div class="bar-label">
                <span>气血</span>
                <span id="enemy-health">50/50</span>
              </div>
              <div class="health-bar">
                <div
                  class="health-fill"
                  id="enemy-health-fill"
                  style="width: 100%"
                ></div>
              </div>
            </div>
            <div class="energy-bar-container">
              <div class="bar-label">
                <span>能量</span>
                <span id="enemy-energy">0/150</span>
              </div>
              <div class="energy-bar">
                <div
                  class="energy-fill"
                  id="enemy-energy-fill"
                  style="width: 0%"
                ></div>
              </div>
            </div>
            <div class="buff-list" id="enemy-buff-list">
              <!-- 敌人BUFF列表将通过JavaScript动态生成 -->
            </div>
          </div>
        </div>

        <!-- 技能灵台 -->
        <div class="skills-platform">
          <div class="skills-title">降妖技能</div>
          <div class="skills-container">
            <button class="skill-btn basic" id="basic-attack">
              <span>普攻<br /><small>无消耗</small></span>
            </button>
            <button class="skill-btn minor" id="skill-1" disabled>
              <span>破甲斩<br /><small>50能量</small></span>
            </button>
            <button class="auto-battle-toggle" id="auto-battle">自动</button>
            <button class="skill-btn minor" id="skill-2" disabled>
              <span>治疗术<br /><small>50能量</small></span>
            </button>
            <button class="skill-btn major" id="ultimate-skill" disabled>
              <span>金刚怒<br /><small>150能量</small></span>
            </button>
          </div>
        </div>

        <div class="battle-log">
          <div class="log-title">战斗心经</div>
          <div id="battle-log-entries">
            <div class="log-entry system">
              战斗开始！选择场景中的敌人开始战斗。
            </div>
          </div>
        </div>
      </div>

      <!-- 右侧区域：功能宝阁 -->

        <div class="functions-tabs">
          <button class="tab-button backpack active" data-tab="backpack">
            乾坤袋
          </button>
          <button class="tab-button crafting" data-tab="crafting">
            修行录
          </button>
          <button class="tab-button character" data-tab="character">
            降妖录
          </button>
          <button class="tab-button skills" data-tab="skills">炼神通</button>
          <button class="tab-button monastery" data-tab="monastery">

              </button>
              <button class="category-btn" data-category="materials">
                材料
              </button>
              <button class="category-btn" data-category="equipment">
                装备
              </button>
              <button class="category-btn" data-category="potions">丹药</button>

            <div class="inventory-items" id="inventory-items">

          </div>

            <div class="crafting-categories">

        addLogEntry(
          '欢迎来到《水墨西游》！选择左侧场景中的敌人开始战斗。',
          'system',
        )

      // 渲染场景列表
      function renderScenes() {
        elements.scenesList.innerHTML = ''

        gameData.scenes.forEach((scene) => {
          const isActive = gameData.currentScene === scene.id
          const currentDifficulty =
            scene.difficultyLevels.find(
              (d) => d.difficulty === gameData.currentDifficulty,
            ) || scene.difficultyLevels[1]
          const isUnlocked = currentDifficulty.unlocked !== false

          const sceneCard = document.createElement('div')
          sceneCard.className = `scene-card ${isActive ? 'active' : ''} ${!isUnlocked ? 'locked' : ''}`
          sceneCard.dataset.sceneId = scene.id

          const difficultyColors = {
            1: 'var(--qing-lv)',
            2: 'var(--jin-se)',
            3: 'var(--zhu-hong)',
          }

          sceneCard.innerHTML = `
              <div class="scene-name">${scene.name}</div>
              <div class="scene-difficulty-selector">
                ${scene.difficultyLevels
                  .map(
                    (d) =>
                      `<span class="diff-badge ${gameData.currentDifficulty === d.difficulty ? 'active' : ''}"
                       style="background: ${gameData.currentDifficulty === d.difficulty ? difficultyColors[d.difficulty] : 'transparent'}; color: ${gameData.currentDifficulty === d.difficulty ? '#fff' : difficultyColors[d.difficulty]}; border-color: ${gameData.currentDifficulty === d.difficulty ? difficultyColors[d.difficulty] : difficultyColors[d.difficulty]}"
                       data-scene-id="${scene.id}" data-diff="${d.difficulty}">${d.name}(${d.enemyLevels})</span>`,
                  )
                  .join('')}
              </div>
            `

          sceneCard.addEventListener('click', (e) => {
            if (e.target.classList.contains('diff-badge')) {
              e.stopPropagation()
              const diff = parseInt(e.target.dataset.diff)
              switchDifficulty(scene.id, diff)
              return
            }

            if (!isUnlocked) return

            document.querySelectorAll('.scene-card').forEach((card) => {
              card.classList.remove('active')
            })
            sceneCard.classList.add('active')
            gameData.currentScene = scene.id

            if (gameData.currentDifficulty === 0) {
              gameData.currentDifficulty = 2
            }

            updateCurrentScene()
          })

          elements.scenesList.appendChild(sceneCard)
        })
      }

      // 切换难度
      function switchDifficulty(sceneId, difficulty) {
        const scene = gameData.scenes.find((s) => s.id === sceneId)
        if (!scene) return

        const diffLevel = scene.difficultyLevels.find(
          (d) => d.difficulty === difficulty,
        )
        if (!diffLevel || diffLevel.unlocked === false) {
          addLogEntry('该难度尚未解锁！', 'system')
          return
        }

        gameData.currentScene = sceneId
        gameData.currentDifficulty = difficulty

        // 更新UI显示
        document.querySelectorAll('.scene-card').forEach((card) => {
          card.classList.remove('active')
          if (
            parseInt(card.dataset.sceneId) === sceneId &&
            parseInt(card.dataset.difficulty) === difficulty
          ) {
            card.classList.add('active')
          }
        })

        updateCurrentScene()
        addLogEntry(`切换到${scene.name} - ${diffLevel.name}难度`, 'system')
      }

      // 更新当前场景
      function updateCurrentScene() {
        const scene = gameData.scenes.find(
          (s) => s.id === gameData.currentScene,
        )
        if (!scene) return

        const currentDifficulty =
          scene.difficultyLevels.find(
            (d) => d.difficulty === gameData.currentDifficulty,
          ) || scene.difficultyLevels[1]

        elements.currentScene.innerHTML = `${scene.name}<span class="scene-difficulty" id="scene-difficulty">${currentDifficulty.name}</span>`

        elements.enemyBubbles.innerHTML = ''
        currentDifficulty.enemies.forEach((enemy, index) => {
          const enemyBubble = document.createElement('div')
          enemyBubble.className = 'enemy-bubble'
          enemyBubble.dataset.enemyIndex = index

          enemyBubble.innerHTML = `
                    <div class="enemy-name">${enemy.name}<span class="enemy-level">[${enemy.level}]</span></div>
                `

          enemyBubble.addEventListener('click', () => {
            startBattle(enemy)
          })

          elements.enemyBubbles.appendChild(enemyBubble)
        })

        const dropsInfo = document.getElementById('enemy-drops-info')
        if (dropsInfo) {
          const allDrops = []
          currentDifficulty.enemies.forEach((enemy) => {
            enemy.drops.forEach((drop) => {
              const existing = allDrops.find((d) => d.id === drop.id)
              if (existing) {
                existing.maxChance = Math.max(existing.maxChance, drop.chance)
              } else {
                allDrops.push({
                  id: drop.id,
                  name: drop.name,
                  maxChance: drop.chance,
                })
              }
            })
          })

          dropsInfo.innerHTML = `
            <span class="enemy-drops-title">敌人可能掉落</span>
            ${allDrops.map((drop) => `<span class="enemy-drop-item">${drop.name}(${drop.maxChance}%)</span>`).join('')}
          `
        }
      }

      // 开始战斗

        gameData.battleState.battleActive = true
        gameData.battleState.isPlayerTurn = true

        gameData.currentEnemy = JSON.parse(JSON.stringify(enemy))
        gameData.player.energy = 25
        gameData.currentEnemy.energy = 0

        updateEnemyInfo()
        updatePlayerInfo()
        updateSkillButtons()

        addLogEntry(
          `战斗开始！对阵${gameData.currentEnemy.name}[${gameData.currentEnemy.level}]。`,
          'system',

        if (gameData.player.isAutoBattle) {
          startAutoBattle()
        }
      }

      // 计算玩家装备加成后的属性
      function calculatePlayerStats() {
        const player = gameData.player

        let minAttack = player.minAttack
        let maxAttack = player.maxAttack
        let defense = player.defense
        let speed = player.speed
        let critRate = player.critRate

        // 装备加成
        if (player.equipment.weapon) {
          const weapon = gameData.equipmentData[player.equipment.weapon]
          minAttack += weapon.minAttack || 0
          maxAttack += weapon.maxAttack || 0

          if (weapon.subtype === 'light') {
            speed *= 1.2
          } else if (weapon.subtype === 'heavy') {
            speed *= 0.8
          }
        }

        if (player.equipment.armor) {
          const armor = gameData.equipmentData[player.equipment.armor]
          defense += armor.defense || 0

          if (armor.subtype === 'leather') {
            speed *= 1.2
          }
        }

        // 等级加成
        minAttack += (player.level - 1) * 1
        maxAttack += (player.level - 1) * 2
        defense += player.level - 1
        speed += player.level - 1
        critRate += (player.level - 1) * 0.5

        return {
          minAttack: Math.round(minAttack),
          maxAttack: Math.round(maxAttack),
          defense: Math.round(defense),
          speed: Math.round(speed),
          critRate: parseFloat(critRate.toFixed(1)),
        }
      }

      // 玩家攻击
      function playerAttack(skillType) {
        if (
          !gameData.battleState.battleActive ||
          !gameData.battleState.isPlayerTurn
        )
          return

        const player = gameData.player
        const enemy = gameData.currentEnemy
        const playerStats = calculatePlayerStats()

        let damage = 0
        let skillName = ''
        let energyCost = 0
        let isCritical = false
        let skillEffect = ''

        const baseAttack =
          Math.floor(
            Math.random() * (playerStats.maxAttack - playerStats.minAttack + 1),
          ) + playerStats.minAttack

        switch (skillType) {
          case 'basic':
            damage = calculateDamage(baseAttack, enemy.defense)
            skillName = '普攻'
            energyCost = 0
            break

          case 'skill1':
            if (player.energy < 50) return
            const armorPierceDamage = baseAttack * 1.2
            const effectiveDefense = enemy.defense * 0.7
            damage = calculateDamage(armorPierceDamage, effectiveDefense)
            skillName = '破甲斩'
            energyCost = 50
            skillEffect = '（无视30%防御）'
            break

          case 'skill2':
            if (player.energy < 50) return
            const healAmount = 50 + player.level * 5
            player.currentHealth = Math.min(
              player.maxHealth,
              player.currentHealth + healAmount,
            )
            skillName = '治疗术'
            energyCost = 50
            addLogEntry(
              `你使用${skillName}，恢复了${healAmount}点气血。`,
              'player',
            )
            updatePlayerInfo()
            break

          case 'ultimate':
            if (player.energy < 150) return
            const ultimateDamage = baseAttack * 2.0
            damage = calculateDamage(ultimateDamage, enemy.defense)
            skillName = '金刚怒'
            energyCost = 150
            if (Math.random() < 0.3) {
              skillEffect = '（造成眩晕）'
            }
            break
        }

        if (damage > 0) {
          if (Math.random() < playerStats.critRate / 100) {
            damage = Math.floor(damage * (player.critDamage / 100))
            isCritical = true
            skillEffect += isCritical ? '（暴击！）' : ''
          }

          damage = Math.max(1, damage)
          enemy.health = Math.max(0, enemy.health - damage)

          addLogEntry(
            `你使用${skillName}${skillEffect}，对${enemy.name}造成${damage}点伤害。`,
            'player',
            isCritical,
          )

          enemy.energy = Math.min(enemy.maxEnergy, enemy.energy + 15)
        }

        if (energyCost > 0) {
          player.energy = Math.max(0, player.energy - energyCost)
        }

        player.energy = Math.min(player.maxEnergy, player.energy + 25)

        updateEnemyInfo()
        updatePlayerInfo()
        updateSkillButtons()

        if (enemy.health <= 0) {
          endBattle(true)
          return
        }

        gameData.battleState.isPlayerTurn = false
        gameData.battleState.turnCount++

        setTimeout(enemyTurn, 800)
      }

      // 敌人回合
      function enemyTurn() {
        if (
          !gameData.battleState.battleActive ||
          gameData.battleState.isPlayerTurn
        )
          return

        const enemy = gameData.currentEnemy
        const player = gameData.player

        enemy.energy = Math.min(enemy.maxEnergy, enemy.energy + 25)

        let enemyAction = 'basic'
        if (enemy.energy >= 50 && Math.random() < 0.5) {
          enemyAction = 'skill'
        }

        let damage = 0
        let skillName = '攻击'
        let energyCost = 0

        const enemyAttack =
          Math.floor(Math.random() * (enemy.maxAttack - enemy.minAttack + 1)) +
          enemy.minAttack

        switch (enemyAction) {
          case 'basic':
            damage = calculateDamage(enemyAttack, player.defense)
            energyCost = 0
            break

          case 'skill':
            damage = calculateDamage(enemyAttack * 1.3, player.defense)
            skillName = '妖术'
            energyCost = 50
            break
        }

        if (energyCost > 0) {
          enemy.energy = Math.max(0, enemy.energy - energyCost)
        }

        player.currentHealth = Math.max(0, player.currentHealth - damage)
        player.energy = Math.min(player.maxEnergy, player.energy + 15)

        addLogEntry(
          `${enemy.name}使用${skillName}，对你造成${damage}点伤害。`,
          'enemy',
        )

        updatePlayerInfo()
        updateEnemyInfo()

        if (player.currentHealth <= 0) {
          endBattle(false)
          return
        }

        gameData.battleState.isPlayerTurn = true
        updateSkillButtons()

        if (gameData.player.isAutoBattle) {
          setTimeout(autoBattleAction, 500)
        }
      }

      // 计算伤害
      function calculateDamage(attack, defense) {
        let damage = attack - defense
        damage = Math.max(1, damage)
        return Math.floor(damage)
      }

      // 结束战斗
      function endBattle(isPlayerVictory) {
        gameData.battleState.battleActive = false

        if (isPlayerVictory) {
          const enemy = gameData.currentEnemy
          const expReward = enemy.level * 10
          gameData.player.experience += expReward

          checkLevelUp()

          const drops = []
          enemy.drops.forEach((drop) => {
            if (Math.random() * 100 < drop.chance) {
              if (!gameData.inventory[drop.id]) {
                const itemData = gameData.itemsData[drop.id]
                gameData.inventory[drop.id] = {
                  name: drop.name,
                  count: drop.count,
                  type: itemData ? itemData.type : 'material',
                  description: itemData ? itemData.description : '未知物品',
                }
              } else {
                gameData.inventory[drop.id].count += drop.count
              }

              drops.push({ name: drop.name, count: drop.count })
            }
          })

          elements.modalTitle.textContent = '战斗胜利'
          elements.modalResult.innerHTML = `你击败了${enemy.name}[${enemy.level}]！<br/>获得经验值：${expReward}`

          elements.rewardsList.innerHTML = ''
          if (drops.length > 0) {
            elements.rewardsList.innerHTML =
              '<div style="margin-top: 8px; color: var(--dan-mo); font-size: 0.9rem;">获得物品：</div>'
            drops.forEach((drop) => {
              const rewardItem = document.createElement('div')
              rewardItem.className = 'reward-item'
              rewardItem.textContent = `${drop.name} × ${drop.count}`
              elements.rewardsList.appendChild(rewardItem)
            })
          }

          addLogEntry(
            `战斗胜利！击败了${enemy.name}，获得${expReward}经验值。`,
            'system',
          )
          renderInventory()
        } else {
          elements.modalTitle.textContent = '战斗失败'
          elements.modalResult.textContent = `你被${gameData.currentEnemy.name}击败了！`
          elements.rewardsList.innerHTML = ''

          gameData.player.currentHealth = Math.floor(
            gameData.player.maxHealth / 2,
          )
          updatePlayerInfo()

          addLogEntry(
            `战斗失败，被${gameData.currentEnemy.name}击败。`,
            'system',
          )
        }

        elements.battleResultModal.classList.add('active')
        stopAutoBattle()
      }

      // 检查升级
      function checkLevelUp() {
        const player = gameData.player

        while (player.experience >= player.maxExperience) {
          player.level++
          player.experience -= player.maxExperience
          player.maxExperience = player.level * 300

          player.maxHealth += 10
          player.currentHealth = player.maxHealth
          player.minAttack += 1
          player.maxAttack += 2
          player.defense += 1
          player.speed += 1
          player.critRate += 0.5

          addLogEntry(`恭喜！你的等级提升到${player.level}！`, 'system')
        }

        // 根据等级更新技能点数
        calculateSkillPoints()
        updateSkillPointsDisplay()
        updatePlayerInfo()
      }

      // 根据等级计算技能点数
      function calculateSkillPoints() {
        const player = gameData.player
        const level = player.level

        let passive = 0
        let minor = 1
        let major = 0

        if (level >= 5) {
          passive = 1
          minor = 2
        }

        if (level >= 10) {
          major = 1
        }

        if (level >= 15) {
          passive = 2
        }

        gameData.player.skillPoints = {
          passive,
          minor,
          major,
        }
      }

      // 更新技能点数显示
      function updateSkillPointsDisplay() {
        if (elements.skillPointsPassive) {
          elements.skillPointsPassive.textContent =
            gameData.player.skillPoints.passive
        }
        if (elements.skillPointsMinor) {
          elements.skillPointsMinor.textContent =
            gameData.player.skillPoints.minor
        }
        if (elements.skillPointsMajor) {
          elements.skillPointsMajor.textContent =
            gameData.player.skillPoints.major
        }
      }

      // 渲染技能选择界面
      function renderSkillSelection() {
        const pathOrder = ['light', 'medium', 'heavy']
        const pathNames = { light: '逍遥游', medium: '金刚怒', heavy: '定风波' }

        let html = ''

        pathOrder.forEach((pathKey) => {
          const pathData = gameData.skillsData[pathKey]
          const selected = gameData.player.selectedSkills

          const isLearned = (skillId, type) => {
            if (type === 'passive') return selected.passive === skillId
            if (type === 'minor')
              return selected.minor1 === skillId || selected.minor2 === skillId
            if (type === 'major') return selected.major === skillId
            return false
          }

          html += `
                <div class="skill-path">
                    <div class="path-name">${pathNames[pathKey]}</div>
            `

          // 被动技能
          if (pathData.passive && pathData.passive.length > 0) {
            html += `
                    <div class="skill-section">
                        <div class="skill-section-title">被动技能</div>
                        <div class="skill-row">
            `
            pathData.passive.forEach((skill) => {
              const learned = isLearned(skill.id, 'passive')
              const viewing = gameData.viewingSkillId === skill.id
              html += `
                            <div class="skill-card ${learned ? 'learned' : 'unselected'} ${viewing ? 'viewing' : ''}"
                                 data-skill-id="${skill.id}" data-type="passive" data-path="${pathKey}">
                                <div class="skill-card-name">${skill.name}</div>
                            </div>
              `
            })
            html += `
                        </div>
                    </div>
            `
          }

          // 小技能
          if (pathData.minor && pathData.minor.length > 0) {
            html += `
                    <div class="skill-section">
                        <div class="skill-section-title">小技能</div>
                        <div class="skill-row">
            `
            pathData.minor.forEach((skill) => {
              const learned = isLearned(skill.id, 'minor')
              const viewing = gameData.viewingSkillId === skill.id
              html += `
                            <div class="skill-card ${learned ? 'learned' : 'unselected'} ${viewing ? 'viewing' : ''}"
                                 data-skill-id="${skill.id}" data-type="minor" data-path="${pathKey}">
                                <div class="skill-card-name">${skill.name}</div>
                                <div class="skill-card-type">${skill.type}</div>
                            </div>
              `
            })
            html += `
                        </div>
                    </div>
            `
          }

          // 大招
          if (pathData.major && pathData.major.length > 0) {
            html += `
                    <div class="skill-section">
                        <div class="skill-section-title">大招</div>
                        <div class="skill-row">
            `
            pathData.major.forEach((skill) => {
              const learned = isLearned(skill.id, 'major')
              const viewing = gameData.viewingSkillId === skill.id
              html += `
                            <div class="skill-card ${learned ? 'learned' : 'unselected'} ${viewing ? 'viewing' : ''}"
                                 data-skill-id="${skill.id}" data-type="major" data-path="${pathKey}">
                                <div class="skill-card-name">${skill.name}</div>
                                <div class="skill-card-type">${skill.type}</div>
                            </div>
              `
            })
            html += `
                        </div>
                    </div>
            `
          }

          html += `
                </div>
          `
        })

        elements.skillsContent.innerHTML = html
      }

      // 绑定技能系统事件监听器（只调用一次）
      function bindSkillEventListeners() {
        // 绑定技能卡片点击事件（使用事件委托）
        document
          .getElementById('skills-content')
          .addEventListener('click', (e) => {
            const card = e.target.closest('.skill-card')
            if (card) {
              const skillId = card.dataset.skillId

              // 设置查看状态
              gameData.viewingSkillId = skillId
              renderSkillSelection()

              // 显示技能详细信息
              updateSkillInfoPanel(skillId)
            }
          })

        // 绑定重置按钮 - 重置所有技能点数
        document
          .getElementById('skill-reset-btn')
          .addEventListener('click', () => {
            gameData.player.selectedSkills = {
              passive: null,
              minor1: null,
              minor2: null,
              major: null,
            }
            gameData.viewingSkillId = null
            renderSkillSelection()
            updateSkillButtons()
            document.getElementById('skill-info-panel').innerHTML = `
            <div class="skill-info-title">技能已重置</div>
            <div class="skill-info-desc">所有技能点数已退还，请重新选择技能</div>
          `
            addLogEntry('技能已重置，所有技能点数已退还', 'system')
          })

        // 绑定确认按钮 - 学习技能
        document
          .getElementById('skill-confirm-btn')
          .addEventListener('click', () => {
            const viewingSkillId = gameData.viewingSkillId
            if (!viewingSkillId) {
              addLogEntry('请先选择一个技能查看详情', 'system')
              return
            }

            // 查找技能信息
            let skill = null
            let skillType = ''
            let pathName = ''

            for (const path in gameData.skillsData) {
              const pathData = gameData.skillsData[path]
              skill = pathData.passive.find((s) => s.id === viewingSkillId)
              if (skill) {
                skillType = 'passive'
                pathName = pathData.pathName
                break
              }
              skill = pathData.minor.find((s) => s.id === viewingSkillId)
              if (skill) {
                skillType = 'minor'
                pathName = pathData.pathName
                break
              }
              skill = pathData.major.find((s) => s.id === viewingSkillId)
              if (skill) {
                skillType = 'major'
                pathName = pathData.pathName
                break
              }
            }

            if (!skill) {
              addLogEntry('技能不存在', 'system')
              return
            }

            // 检查技能点是否足够
            const currentPoints = gameData.player.skillPoints[skillType]
            if (currentPoints <= 0) {
              addLogEntry(`技能点不足，无法学习${skill.name}`, 'system')
              return
            }

            // 检查是否已学习该技能
            const isAlreadyLearned = () => {
              const selected = gameData.player.selectedSkills
              if (skillType === 'passive')
                return selected.passive === viewingSkillId
              if (skillType === 'minor')
                return (
                  selected.minor1 === viewingSkillId ||
                  selected.minor2 === viewingSkillId
                )
              if (skillType === 'major')
                return selected.major === viewingSkillId
              return false
            }

            if (isAlreadyLearned()) {
              addLogEntry(`你已经学习了${skill.name}`, 'system')
              return
            }

            // 学习技能
            const learnSkill = () => {
              const selected = gameData.player.selectedSkills
              if (skillType === 'passive') {
                selected.passive = viewingSkillId
              } else if (skillType === 'minor') {
                if (!selected.minor1) {
                  selected.minor1 = viewingSkillId
                } else if (!selected.minor2) {
                  selected.minor2 = viewingSkillId
                } else {
                  addLogEntry('小技能栏位已满', 'system')
                  return false
                }
              } else if (skillType === 'major') {
                selected.major = viewingSkillId
              }
              return true
            }

            if (learnSkill()) {
              // 减少技能点
              gameData.player.skillPoints[skillType]--
              addLogEntry(`成功学习技能：${skill.name} (${pathName})`, 'system')
              updateSkillPointsDisplay()
              renderSkillSelection()
            }
          })
      }

      // 更新技能信息面板
      function updateSkillInfoPanel(skillId) {
        let skill = null
        let pathName = ''
        let skillType = ''

        // 查找技能（包含被动技能）
        for (const path in gameData.skillsData) {
          const pathData = gameData.skillsData[path]
          skill = pathData.passive.find((s) => s.id === skillId)
          if (skill) {
            pathName = pathData.pathName
            skillType = '被动'
            break
          }
          skill = pathData.minor.find((s) => s.id === skillId)
          if (skill) {
            pathName = pathData.pathName
            skillType = '小技能'
            break
          }
          skill = pathData.major.find((s) => s.id === skillId)
          if (skill) {
            pathName = pathData.pathName
            skillType = '大招'
            break
          }
        }

        if (!skill) return

        const isLearned =
          gameData.player.selectedSkills.passive === skillId ||
          gameData.player.selectedSkills.minor1 === skillId ||
          gameData.player.selectedSkills.minor2 === skillId ||
          gameData.player.selectedSkills.major === skillId

        document.getElementById('skill-info-panel').innerHTML = `
          <div class="skill-info-title">${skill.name} ${isLearned ? '✓' : ''}</div>
          <div class="skill-info-desc">${skill.description}</div>
          <div class="skill-info-stats">
            <span class="skill-info-stat">流派: ${pathName}</span>
            <span class="skill-info-stat">类型: ${skillType}</span>
            ${skill.cost ? `<span class="skill-info-stat">消耗: ${skill.cost}能量</span>` : ''}
          </div>
        `
      }

        document.querySelectorAll('.skill-option').forEach((option) => {
          option.addEventListener('click', () => {
            const skillId = option.dataset.skillId
            const skillType = option.dataset.skillType

            // 检查技能点数
            if (
              skillType === 'passive' &&
              gameData.player.skillPoints.passive > 0
            ) {
              gameData.player.selectedSkills.passive = skillId
              gameData.player.skillPoints.passive--
            } else if (
              skillType === 'minor' &&
              gameData.player.skillPoints.minor > 0
            ) {

              }
              gameData.player.skillPoints.minor--
            } else if (
              skillType === 'major' &&
              gameData.player.skillPoints.major > 0
            ) {
              gameData.player.selectedSkills.major = skillId
              gameData.player.skillPoints.major--
            }

            openSkillModal()
          })
        })
      }

      // 获取技能名称
      function getSkillName(skillId) {
        for (const path in gameData.skillsData) {
          for (const type of ['passive', 'minor', 'major']) {
            const skill = gameData.skillsData[path][type].find(
              (s) => s.id === skillId,
            )
            if (skill) return skill.name
          }
        }
        return '未知技能'
      }
