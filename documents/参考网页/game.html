      // 制作物品
      function craftItem(recipe) {
        const recipeData = gameData.equipmentData[recipe]
        if (!recipeData) return

        // 检查材料是否足够
        let hasMaterials = true
        recipeData.materials.forEach(({ id, count }) => {
          if (!gameData.inventory[id] || gameData.inventory[id].count < count) {
            hasMaterials = false
          }
        })

        if (!hasMaterials) {
          addLogEntry('材料不足，无法制作！', 'system')
          return
        }

        // 消耗材料
        recipeData.materials.forEach(({ id, count }) => {
          gameData.inventory[id].count -= count
          if (gameData.inventory[id].count <= 0) {
            delete gameData.inventory[id]
          }
        })

        // 获取技艺经验
        const skillType =
          recipeData.type === 'weapon'
            ? 'weaponCrafting'
            : recipeData.type === 'armor'
              ? 'armorCrafting'
              : 'accessoryCrafting'

        gameData.skills[skillType].experience += 1

        // 检查技艺升级
        if (
          gameData.skills[skillType].experience >=
          gameData.skills[skillType].maxExperience
        ) {
          gameData.skills[skillType].level++
          gameData.skills[skillType].experience = 0

          // 根据等级设置下一级经验需求
          const expRequirements = [2, 3, 5, 8, 12, 17, 23, 30, 38, 47]
          gameData.skills[skillType].maxExperience =
            expRequirements[gameData.skills[skillType].level] || 50

          addLogEntry(
            `${getSkillTypeName(skillType)}提升到等级${gameData.skills[skillType].level}！`,
            'system',
          )
        }

        // 添加成品到库存
        if (!gameData.inventory[recipe]) {
          gameData.inventory[recipe] = {
            name: recipeData.name,
            count: 1,
            type: 'equipment',
            description: recipeData.description,
          }
        } else {
          gameData.inventory[recipe].count++
        }

        // 更新显示
        renderInventory()
        renderCraftingSkills()

        addLogEntry(`成功制作了${recipeData.name}！`, 'system')
      }

      // 获取技艺类型名称
      function getSkillTypeName(skillType) {
        const names = {
          weaponCrafting: '武器制作',
          armorCrafting: '衣甲制作',
          accessoryCrafting: '饰品制作',
        }
        return names[skillType] || skillType
      }

      // 渲染角色信息
      function renderCharacterInfo() {
        const equipmentSlots = document.getElementById('equipment-slots')

        equipmentSlots.innerHTML = `
                <div style="margin-top: 12px; font-size: 1.1rem; color: var(--nong-mo); margin-bottom: 8px; text-align: center; font-weight: bold;">装备</div>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
                    <div class="equipment-slot" data-slot="weapon">
                        <div style="font-size: 0.9rem; color: var(--dan-mo);">武器</div>
                        <div style="font-size: 0.85rem; color: var(--nong-mo); font-weight: bold;">${gameData.player.equipment.weapon ? gameData.equipmentData[gameData.player.equipment.weapon]?.name : '无'}</div>
                    </div>
                    <div class="equipment-slot" data-slot="armor">
                        <div style="font-size: 0.9rem; color: var(--dan-mo);">衣甲</div>
                        <div style="font-size: 0.85rem; color: var(--nong-mo); font-weight: bold;">${gameData.player.equipment.armor ? gameData.equipmentData[gameData.player.equipment.armor]?.name : '无'}</div>
                    </div>
                    <div class="equipment-slot" data-slot="accessory1">
                        <div style="font-size: 0.9rem; color: var(--dan-mo);">饰品1</div>
                        <div style="font-size: 0.85rem; color: var(--nong-mo); font-weight: bold;">${gameData.player.equipment.accessory1 ? gameData.equipmentData[gameData.player.equipment.accessory1]?.name : '无'}</div>
                    </div>
                    <div class="equipment-slot" data-slot="accessory2">
                        <div style="font-size: 0.9rem; color: var(--dan-mo);">饰品2</div>
                        <div style="font-size: 0.85rem; color: var(--nong-mo); font-weight: bold;">${gameData.player.equipment.accessory2 ? gameData.equipmentData[gameData.player.equipment.accessory2]?.name : '无'}</div>
                    </div>
                </div>
            `

        // 绑定装备槽点击事件
        document.querySelectorAll('.equipment-slot').forEach((slot) => {
          slot.addEventListener('click', () => {
            const slotType = slot.dataset.slot
            openEquipmentSelector(slotType)
          })
        })
      }

      // 打开装备选择器
      function openEquipmentSelector(slotType) {
        const equipmentList = Object.keys(gameData.inventory).filter(
          (itemId) => {
            const item = gameData.inventory[itemId]
            if (item.type !== 'equipment') return false

            const equipment = gameData.equipmentData[itemId]
            if (!equipment) return false

            return (
              equipment.type ===
              (slotType.includes('accessory') ? 'accessory' : slotType)
            )
          },
        )

        if (equipmentList.length === 0) {
          addLogEntry(
            `没有可装备的${slotType.includes('accessory') ? '饰品' : slotType}`,
            'system',
          )
          return
        }

        let selectorHTML = `<div style="margin-bottom: 12px; color: var(--dan-mo);">选择${slotType.includes('accessory') ? '饰品' : slotType}：</div>`

        equipmentList.forEach((itemId) => {
          const item = gameData.inventory[itemId]
          const equipment = gameData.equipmentData[itemId]

          selectorHTML += `
                    <div class="craft-item" style="margin-bottom: 8px;" data-equip-id="${itemId}" data-slot-type="${slotType}">
                        <div class="craft-item-name">${item.name} ×${item.count}</div>
                        <div class="craft-item-materials">${equipment.description}</div>
                    </div>
                `
        })

        elements.forgeContent.innerHTML = selectorHTML
        elements.forgeModal.classList.add('active')

        // 绑定装备事件
        document.querySelectorAll('[data-equip-id]').forEach((item) => {
          item.addEventListener('click', () => {
            const equipId = item.dataset.equipId
            const slotType = item.dataset.slotType
            equipItem(slotType, equipId)
            elements.forgeModal.classList.remove('active')
          })
        })
      }

      // 装备物品
      function equipItem(slotType, itemId) {
        // 卸下当前装备
        const currentEquip = gameData.player.equipment[slotType]
        if (currentEquip) {
          if (!gameData.inventory[currentEquip]) {
            const equipment = gameData.equipmentData[currentEquip]
            gameData.inventory[currentEquip] = {
              name: equipment?.name || currentEquip,
              count: 1,
              type: 'equipment',
              description: equipment?.description || '未知装备',
            }
          } else {
            gameData.inventory[currentEquip].count++
          }
        }

        // 装备新物品
        gameData.player.equipment[slotType] = itemId

        // 从库存中移除一件
        gameData.inventory[itemId].count--
        if (gameData.inventory[itemId].count <= 0) {
          delete gameData.inventory[itemId]
        }

        // 更新显示
        renderCharacterInfo()
        updatePlayerInfo()
        renderInventory()

        const equipment = gameData.equipmentData[itemId]
        addLogEntry(`装备了${equipment?.name || itemId}！`, 'system')
      }

      // 打开打造装备界面
      function openForgeModal() {
        let forgeContent = `
                <div style="margin-bottom: 15px; color: var(--dan-mo);">选择要打造的装备类型：</div>
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button class="selection-btn forge-type" data-type="weapon">武器</button>
                    <button class="selection-btn forge-type" data-type="armor">衣甲</button>
                    <button class="selection-btn forge-type" data-type="accessory">饰品</button>
                </div>
                <div id="forge-items-list"></div>
            `

        elements.forgeContent.innerHTML = forgeContent
        elements.forgeModal.classList.add('active')

        // 绑定装备类型选择
        document.querySelectorAll('.forge-type').forEach((btn) => {
          btn.addEventListener('click', () => {
            const type = btn.dataset.type
            showForgeItems(type)
          })
        })

        // 默认显示武器
        showForgeItems('weapon')
      }

      // 显示可打造的装备
      function showForgeItems(type) {
        const forgeItemsList = document.getElementById('forge-items-list')
        if (!forgeItemsList) return

        const items = Object.keys(gameData.equipmentData)
          .filter((id) => gameData.equipmentData[id].type === type)
          .map((id) => gameData.equipmentData[id])

        if (items.length === 0) {
          forgeItemsList.innerHTML =
            '<div style="text-align: center; color: var(--dan-mo); padding: 20px;">暂无配方</div>'
          return
        }

        forgeItemsList.innerHTML = items
          .map(
            (item) => `
                <div class="forge-item" data-item-id="${item.id}">
                    <div class="forge-item-name">${item.name}</div>
                    <div class="forge-item-stats">${getEquipmentStatsText(item)}</div>
                    <div class="forge-item-materials">需要: ${item.materials.map((m) => `${m.count}×${gameData.itemsData[m.id]?.name || m.id}`).join(' + ')}</div>
                </div>
            `,
          )
          .join('')

        // 绑定打造事件
        document.querySelectorAll('.forge-item').forEach((item) => {
          item.addEventListener('click', () => {
            const itemId = item.dataset.itemId
            craftItem(itemId)
          })
        })
      }

      // 获取装备属性文本
      function getEquipmentStatsText(equipment) {
        if (equipment.type === 'weapon') {
          return `攻击: ${equipment.minAttack}-${equipment.maxAttack}`
        } else if (equipment.type === 'armor') {
          return `防御: ${equipment.defense}`
        } else if (equipment.type === 'accessory') {
          return `气血: +${equipment.healthPercent}%`
        }
        return ''
      }

      // ============================================
      // 辅助功能
      // ============================================

      // 更新技能按钮状态
      function updateSkillButtons() {
        const player = gameData.player
        elements.basicAttack.disabled = false
        elements.skill1.disabled = player.energy < 50
        elements.skill2.disabled = player.energy < 50
        elements.ultimateSkill.disabled = player.energy < 150
        elements.autoBattle.classList.toggle('active', player.isAutoBattle)
      }

      // 添加战斗日志
      function addLogEntry(text, type = 'system', isCritical = false) {
        const logEntry = document.createElement('div')
        logEntry.className = `log-entry ${type} ${isCritical ? 'critical' : ''}`
        logEntry.textContent = `[${getCurrentTime()}] ${text}`

        elements.battleLogEntries.appendChild(logEntry)
        elements.battleLogEntries.scrollTop =
          elements.battleLogEntries.scrollHeight

        const logEntries =
          elements.battleLogEntries.querySelectorAll('.log-entry')
        if (logEntries.length > 15) {
          logEntries[0].remove()
        }
      }

      // 获取当前时间
      function getCurrentTime() {
        const now = new Date()
        return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`
      }

      // 自动战斗
      function startAutoBattle() {
        if (gameData.autoBattleInterval) {
          clearInterval(gameData.autoBattleInterval)
        }

        gameData.autoBattleInterval = setInterval(() => {
          if (
            gameData.battleState.battleActive &&
            gameData.battleState.isPlayerTurn
          ) {
            autoBattleAction()
          }
        }, 800)

        gameData.player.isAutoBattle = true
        elements.autoBattle.classList.add('active')
      }

      function stopAutoBattle() {
        if (gameData.autoBattleInterval) {
          clearInterval(gameData.autoBattleInterval)
          gameData.autoBattleInterval = null
        }

        gameData.player.isAutoBattle = false
        elements.autoBattle.classList.remove('active')
      }

      function autoBattleAction() {
        if (
          !gameData.battleState.battleActive ||
          !gameData.battleState.isPlayerTurn
        )
          return

        const player = gameData.player

        if (
          player.energy >= 150 &&
          player.currentHealth < player.maxHealth * 0.5
        ) {
          playerAttack('ultimate')
        } else if (
          player.energy >= 50 &&
          player.currentHealth < player.maxHealth * 0.7
        ) {
          playerAttack('skill2')
        } else if (player.energy >= 50) {
          playerAttack('skill1')
        } else {
          playerAttack('basic')
        }
      }

      // 创建墨晕效果
      function createInkEffects() {
        const inkEffectsContainer = document.getElementById('ink-effects')

        for (let i = 0; i < 4; i++) {
          const inkBlot = document.createElement('div')
          inkBlot.className = 'ink-blot'

          const size = Math.random() * 150 + 80
          const x = Math.random() * 100
          const y = Math.random() * 100
          const opacity = Math.random() * 0.08 + 0.04

          inkBlot.style.width = `${size}px`
          inkBlot.style.height = `${size}px`
          inkBlot.style.left = `${x}%`
          inkBlot.style.top = `${y}%`
          inkBlot.style.opacity = opacity

          inkEffectsContainer.appendChild(inkBlot)
        }
      }

      // ============================================
      // 事件监听器绑定
      // ============================================
      function bindEventListeners() {
        // 技能按钮事件
        elements.basicAttack.addEventListener('click', () =>
          playerAttack('basic'),
        )
        elements.skill1.addEventListener('click', () => playerAttack('skill1'))
        elements.skill2.addEventListener('click', () => playerAttack('skill2'))
        elements.ultimateSkill.addEventListener('click', () =>
          playerAttack('ultimate'),
        )

        // 自动战斗切换
        elements.autoBattle.addEventListener('click', () => {
          gameData.player.isAutoBattle = !gameData.player.isAutoBattle

          if (gameData.player.isAutoBattle) {
            startAutoBattle()
            addLogEntry('开启自动战斗', 'system')
          } else {
            stopAutoBattle()
            addLogEntry('关闭自动战斗', 'system')
          }

          updateSkillButtons()
        })

        // 标签页切换
        elements.tabButtons.forEach((button) => {
          button.addEventListener('click', () => {
            const tabId = button.classList[1]

            elements.tabButtons.forEach((btn) => btn.classList.remove('active'))
            button.classList.add('active')

            elements.tabPanes.forEach((pane) => pane.classList.remove('active'))
            document.getElementById(`${tabId}-tab`).classList.add('active')

            if (tabId === 'backpack') {
              renderInventory()
            }
          })
        })

        // 库存分类切换
        document.querySelectorAll('.category-btn').forEach((button) => {
          button.addEventListener('click', function () {
            document
              .querySelectorAll('.category-btn')
              .forEach((btn) => btn.classList.remove('active'))
            this.classList.add('active')

            const category = this.dataset.category
            renderInventory(category)
          })
        })

        // 弹窗按钮
        elements.modalContinue.addEventListener('click', () => {
          elements.battleResultModal.classList.remove('active')
        })

        elements.forgeClose.addEventListener('click', () => {
          elements.forgeModal.classList.remove('active')
        })

        elements.skillConfirm.addEventListener('click', () => {
          elements.skillModal.classList.remove('active')
          renderSkillSelection()
          addLogEntry('技能选择已确认', 'system')
        })

        elements.skillReset.addEventListener('click', () => {
          gameData.player.selectedSkills = {
            passive: null,
            minor1: null,
            minor2: null,
            major: null,
          }
          gameData.player.skillPoints = {
            passive: 1,
            minor: 2,
            major: 1,
          }
          gameData.player.skillPath = null

          elements.skillModal.classList.remove('active')
          renderSkillSelection()
          addLogEntry('技能已重置', 'system')
        })

        elements.skillClose.addEventListener('click', () => {
          elements.skillModal.classList.remove('active')
        })

        elements.strengthenClose.addEventListener('click', () => {
          elements.strengthenModal.classList.remove('active')
        })

        // 洞府功能按钮
        elements.actionForge.addEventListener('click', openForgeModal)

        elements.actionAlchemy.addEventListener('click', () => {
          addLogEntry('炼丹功能正在开发中', 'system')
        })

        elements.actionStrengthen.addEventListener('click', () => {
          addLogEntry('强化装备功能正在开发中', 'system')
        })

        elements.actionUpgrade.addEventListener('click', () => {
          addLogEntry('装备升星功能正在开发中', 'system')
        })

        // 点击弹窗外部关闭弹窗
        document.querySelectorAll('.modal-overlay').forEach((modal) => {
          modal.addEventListener('click', (e) => {
            if (e.target === modal) {
              modal.classList.remove('active')
            }
          })
        })
      }

      // ============================================
      // 游戏启动
      // ============================================
      document.addEventListener('DOMContentLoaded', initGame)
    </script>
  </body>
</html>
