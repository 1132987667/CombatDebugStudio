<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斗战西游 - 全流派天赋树 (通用40/专属20)</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--border:#334155;--text:#e2e8f0;--sec:#94a3b8;
--c1:#10b981;--c2:#3b82f6;--c3:#8b5cf6;--c5:#f59e0b;--on:#06b6d4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:15px;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar h1{font-size:18px;color:var(--on)}
.stat{font-size:13px;color:var(--sec);background:var(--bg);padding:6px 12px;border-radius:4px;border:1px solid var(--border)}
.stat b{color:var(--c5);font-size:15px}
.btn-reset{background:var(--c3);color:#fff;border:none;padding:7px 14px;border-radius:4px;cursor:pointer;font-size:13px}
.canvas-wrap{flex:1;overflow:auto;display:flex;justify-content:center;padding:20px 10px}
#canvas{position:relative;width:1110px;flex-shrink:0}
#lines{position:absolute;top:0;left:0;pointer-events:none}
.flow-head{position:absolute;width:200px;text-align:center;padding:8px 0;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;border:2px solid var(--border);background:var(--panel);color:var(--sec);transition:.2s}
.flow-head.active{border-color:var(--on);color:#fff;background:rgba(6,182,212,.2);box-shadow:0 0 12px rgba(6,182,212,.3)}
.flow-head:hover{border-color:var(--on)}
.tier-tag{position:absolute;left:0;width:1110px;text-align:center;color:var(--sec);font-size:11px;letter-spacing:3px;pointer-events:none}
.tier-tag::before,.tier-tag::after{content:'';position:absolute;top:50%;height:1px;background:var(--border)}
.tier-tag::before{left:0;width:430px}.tier-tag::after{right:0;width:430px}
.node{position:absolute;width:200px;background:var(--panel);border:2px solid var(--border);border-radius:8px;padding:7px 9px;cursor:pointer;transition:transform .15s;user-select:none}
.node:hover{transform:scale(1.05);z-index:5}
.node .n-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.node .n-name{font-size:12.5px;font-weight:700}
.node .n-cost{font-size:10.5px;font-weight:700;color:#fff;border-radius:10px;padding:1px 7px}
.node .n-fx{font-size:10.5px;color:var(--sec);line-height:1.4}
.node.cost-1{border-color:var(--c1)}.node.cost-1 .n-cost{background:var(--c1)}
.node.cost-2{border-color:var(--c2)}.node.cost-2 .n-cost{background:var(--c2)}
.node.cost-3{border-color:var(--c3)}.node.cost-3 .n-cost{background:var(--c3)}
.node.cost-5{border-color:var(--c5);box-shadow:0 0 12px rgba(245,158,11,.25)}.node.cost-5 .n-cost{background:var(--c5)}
.node.trunk{background:#243449}
.node.trunk .n-name::before{content:'◆ ';color:var(--on)}
.node.on{background:rgba(6,182,212,.18);box-shadow:0 0 10px rgba(6,182,212,.45)}
.node.on .n-fx{color:var(--text)}
.node.dim{opacity:.35}
.legend{display:flex;gap:18px;justify-content:center;padding:9px;background:var(--panel);border-top:1px solid var(--border);font-size:12px;color:var(--sec);flex-shrink:0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
</style>
</head>
<body>
<div class="topbar">
    <h1>⚔️ 流派天赋树 · 通用40 / 专属20</h1>
    <span class="stat">通用(主干) <b id="s-common">0</b>/40</span>
    <span class="stat">专属(支流) <b id="s-flow">0</b>/20</span>
    <span class="stat">剩余 <b id="s-left">60</b> 点</span>
    <button class="btn-reset" onclick="resetAll()">重置</button>
</div>
<div class="canvas-wrap"><div id="canvas"></div></div>
<div class="legend">
    <span><i style="background:var(--c1)"></i>1点</span><span><i style="background:var(--c2)"></i>2点</span>
    <span><i style="background:var(--c3)"></i>3点</span><span><i style="background:var(--c5)"></i>5点·终极</span>
    <span>◆=通用主干(40点)</span><span>支流=流派专精(20点) · 点击列头选流派</span>
</div>
<script>
const W=1110,NW=200,NH=56,PITCH=72,NODE_Y0=96;
const COLX={combo:10,crit:230,trunk:455,shield:680,dodge:900};
/* ===== 通用主干 18节点 = 40点 ===== */
const TRUNK=[
 {name:'气血强化',cost:2,fx:'气血 +15% (L2)'},{name:'攻击强化',cost:2,fx:'攻击 +15% (L2)'},
 {name:'速度微调',cost:2,fx:'速度 +10 (L1)'},{name:'精准打击',cost:2,fx:'命中+15% 效果命中+10%'},
 {name:'坚韧意志',cost:2,fx:'免伤+5% 控制豁免+10%'},{name:'能量积蓄',cost:1,fx:'初始能量 +20'},
 {name:'伤害精通',cost:3,fx:'伤害加成 +10% (L2)'},{name:'生存精通',cost:2,fx:'最终伤害减免 +3% (L4)'},
 {name:'下盘稳固',cost:2,fx:'暴击抵抗+10% 暴伤减免+10%'},{name:'能量流转',cost:2,fx:'能量获取效率 +10%'},
 {name:'战斗直觉',cost:3,fx:'暴击率+5% 连击率+5%'},{name:'铁壁',cost:2,fx:'护盾加成+10% 反伤+5%'},
 {name:'真伤觉醒',cost:2,fx:'真伤率 +5% (L1)'},
 {name:'战术洞察',cost:3,fx:'AI: 优先攻击暴露后排'},{name:'弱点洞察',cost:2,fx:'破甲+10% 易伤+5%'},
 {name:'杀意',cost:3,fx:'最终伤害提升 +5% (L4)'},{name:'不屈',cost:2,fx:'最终伤害减免 +3% (L4)'},
 {name:'宗师气度',cost:3,fx:'全伤害+6% 全减伤+6%'}];
/* 支流节点行位置 & 突破门槛 */
const BR_ROWS=[0,2,4,6,8,10,13,15];
const GATE={2:'c4',4:'c8',6:'c13'}; // 支流T2/T3/T4首节点 需主干对应节点
/* ===== 四大流派 各8节点 = 20点 ===== */
const FLOWS={
 combo:{title:'斗战·连击流',nodes:[
  ['连击本能',2,'连击率 +10% (L1)'],['风势初显',3,'普攻叠风势,每层+2%连击'],
  ['裂甲',3,'连击降敌5%防御,叠3层'],['连击系数',2,'连击伤害系数 +5% (L3)'],
  ['风势涌动',2,'满层风势 +10%伤害'],['连击乘区',3,'连击独立系数 +8% (L3)'],
  ['无影',5,'4连后第5段+50%,无视20%防'],['连击大师',2,'连击率+10% 连击伤害+10%']]},
 crit:{title:'破军·暴伤流',nodes:[
  ['暴击本能',2,'暴击率 +10% (L1)'],['破绽初显',3,'暴击叠破绽,降暴伤减免'],
  ['斩杀',3,'目标<30%血时暴伤翻倍'],['暴击系数',2,'暴伤系数 +8% (L3)'],
  ['破绽涌动',2,'满层破绽 +15%伤害'],['暴伤乘区',3,'暴伤独立系数 +8% (L3)'],
  ['破军',5,'对破绽目标附20%max气血真伤'],['暴伤大师',2,'暴击率+10% 暴伤+15%']]},
 shield:{title:'不动·反伤流',nodes:[
  ['护盾初显',3,'回合始获15%max气血护盾'],['反伤强化',2,'伤害反弹 +10% (L1)'],
  ['怒目',3,'盾碎嘲讽1回合,反伤+30%'],['免伤系数',2,'免伤系数 +8% (L3)'],
  ['荆棘',2,'有盾时反弹 +15%'],['反伤乘区',3,'反伤独立系数 +8% (L3)'],
  ['不动',5,'单次受伤≤25%max气血,反伤无视防'],['反伤大师',2,'防御+15% 反伤+10%']]},
 dodge:{title:'幻影·闪避流',nodes:[
  ['闪避本能',2,'闪避率 +10% (L1)'],['残影初显',3,'闪避叠残影,每层+5%反击'],
  ['影袭',3,'反击50%致盲目标1回合'],['闪避系数',2,'闪避系数 +8% (L3)'],
  ['幻步',2,'闪避后下次伤害+10%'],['反击乘区',3,'反击独立系数 +8% (L3)'],
  ['幻影',5,'闪避超50%部分,1%转0.5%最终减伤'],['闪避大师',2,'闪避率+10% 反击率+10%']]}};
let selFlow='combo',sel=new Set();
const rowY=r=>NODE_Y0+r*PITCH;
function render(){
 const H=NODE_Y0+18*PITCH+20;
 const cv=document.getElementById('canvas');cv.style.height=H+'px';
 let svg=`<svg id="lines" width="${W}" height="${H}">`;
 for(let i=0;i<17;i++) svg+=vl(COLX.trunk+NW/2,rowY(i)+NH,rowY(i+1),true);
 for(const f in FLOWS){
   for(let i=0;i<7;i++) svg+=vl(COLX[f]+NW/2,rowY(BR_ROWS[i])+NH,rowY(BR_ROWS[i+1]),f===selFlow);
   [[0,0],[2,4],[4,8],[6,13]].forEach(([bi,ti])=>{
     const left=f==='combo'||f==='crit';
     const tx=left?COLX.trunk:COLX.trunk+NW, fx=left?COLX[f]+NW:COLX[f];
     svg+=`<path d="M${tx},${rowY(ti)+NH/2} L${fx},${rowY(BR_ROWS[bi])+NH/2}" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4" fill="none"/>`;});
 }
 svg+='</svg>';
 let html=svg;
 [[0,'一阶突破 · 10级'],[4,'二阶突破 · 20级'],[8,'三阶突破 · 30级'],[13,'四阶突破 · 40级']]
   .forEach(t=>html+=`<div class="tier-tag" style="top:${rowY(t[0])-16}px">${t[1]}</div>`);
 for(const f in FLOWS) html+=`<div class="flow-head${f===selFlow?' active':''}" data-f="${f}" style="left:${COLX[f]}px;top:0">${FLOWS[f].title}</div>`;
 html+=`<div class="flow-head active" style="left:${COLX.trunk}px;top:0;cursor:default">通用主干 40点</div>`;
 TRUNK.forEach((n,i)=>html+=nodeHtml(n,COLX.trunk,rowY(i),'t'+i,true));
 for(const f in FLOWS) FLOWS[f].nodes.forEach((n,i)=>html+=nodeHtml({name:n[0],cost:n[1],fx:n[2]},COLX[f],rowY(BR_ROWS[i]),f+':'+i,false,f));
 cv.innerHTML=html;
 cv.querySelectorAll('.flow-head[data-f]').forEach(h=>h.onclick=()=>{selFlow=h.dataset.f;render();});
 cv.querySelectorAll('.node').forEach(el=>el.onclick=()=>toggle(el.dataset.id));
 refresh();
}
function vl(x,y1,y2,b){return `<path d="M${x},${y1} L${x},${y2}" stroke="${b?'#06b6d4':'#475569'}" stroke-width="${b?2.5:2}" fill="none"/>`;}
function nodeHtml(n,x,y,key,trunk){
 const on=sel.has(key),ok=parentOk(key);
 return `<div class="node cost-${n.cost}${trunk?' trunk':''}${on?' on':(ok&&!on?'':' dim')}" data-id="${key}" style="left:${x}px;top:${y}px">
  <div class="n-head"><span class="n-name">${n.name}</span><span class="n-cost">${n.cost}点</span></div>
  <div class="n-fx">${n.fx}</div></div>`;
}
function parentOk(key){
 if(key.startsWith('t')){const i=+key.slice(1);return i===0||sel.has('t'+(i-1));}
 const [f,iStr]=key.split(':'),i=+iStr;
 if(f!==selFlow)return false;
 if(i>0&&!sel.has(f+':'+(i-1)))return false;
 const g=GATE[i]; if(g&&!sel.has(g))return false;
 return true;
}
function toggle(key){
 if(sel.has(key)){
   for(const k of sel) if(childOf(k)===key){toast('请先取消子节点');return;}
   sel.delete(key);
 }else{
   if(!parentOk(key)){toast('需先点亮前置节点');return;}
   const isT=key.startsWith('t');
   if(used(isT)+nodeCost(key)>(isT?40:20)){toast('该分支点数不足');return;}
   sel.add(key);
 }
 render();
}
function childOf(k){
 if(k.startsWith('t')){const i=+k.slice(1);return i<17?'t'+(i+1):null;}
 const [f,i]=k.split(':');return +i<7?f+':'+(+i+1):null;
}
function nodeCost(key){
 if(key.startsWith('t'))return TRUNK[+key.slice(1)].cost;
 const [f,i]=key.split(':');return FLOWS[f].nodes[+i][1];
}
function used(isT){let s=0;sel.forEach(k=>{if(k.startsWith('t')===isT)s+=nodeCost(k);});return s;}
function refresh(){
 document.getElementById('s-common').innerText=used(true);
 document.getElementById('s-flow').innerText=used(false);
 document.getElementById('s-left').innerText=60-used(true)-used(false);
}
function resetAll(){sel.clear();render();}
function toast(m){let t=document.getElementById('toast');
 if(!t){t=document.createElement('div');t.id='toast';
  t.style.cssText='position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:99;transition:opacity .3s';
  document.body.appendChild(t);}
 t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1500);}
render();
</script>
</body>
</html>
